<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册流程测量平台</title>
<link href="/static/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f5f6fa; }
  .flow-badge { font-size: 0.75rem; padding: 0.25em 0.6em; border-radius: 10px; white-space: nowrap; }
  .b-direct_password { background: #d1e7dd; color: #0f5132; }
  .b-verification_then_password { background: #cff4fc; color: #055160; }
  .b-otp_only { background: #fff3cd; color: #664d03; }
  .b-email_only { background: #e2d9f3; color: #4a2a8a; }
  .b-sso_only { background: #f8d7da; color: #842029; }
  .b-multiple_methods { background: #d1d5f9; color: #3b2f8a; }
  .b-human_blocked { background: #fde2e2; color: #842029; }
  .b-unknown, .b-error { background: #e9ecef; color: #495057; }
  .b-no_web_signup { background: #e2e3e5; color: #383d41; }
  .match-badge { font-size: 0.7rem; }
  .verified { background: #d1e7dd; color: #0f5132; }
  .pending { background: #fff3cd; color: #664d03; }
  .card { border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .step-row { border-left: 3px solid #dee2e6; padding-left: 10px; margin-bottom: 8px; font-size: 0.9rem; }
  .step-tab-btn {
    padding: 6px 16px; margin-right: 6px; border: 1px solid #dee2e6;
    border-radius: 6px; background: #fff; color: #495057; cursor: pointer; font-size: 0.9rem;
  }
  .step-tab-btn.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }
  .step-tab-btn:not(.active):hover { background: #e9ecef; }
  .my-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 1050;
  }
  .my-modal-box {
    background: #fff; border-radius: 12px; width: 90%; max-width: 720px;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .my-modal-lg { max-width: 900px; }
  .my-modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid #dee2e6;
  }
  .my-modal-body { padding: 16px 18px; overflow-y: auto; }
  .my-modal-foot {
    padding: 12px 18px; border-top: 1px solid #dee2e6; text-align: right;
  }
  .my-modal-close {
    border: none; background: none; font-size: 22px; line-height: 1;
    cursor: pointer; color: #6c757d;
  }
  .search-bar { max-width: 720px; }
  .site-title { font-size: 0.95rem; }
  .route-text { font-size: 0.8rem; color: #6c757d; }
  .side-badge { font-size: 0.72rem; padding: 1px 6px; border-radius: 8px; margin-left: 4px; white-space: nowrap; }
  .badge-ok { background: #e6f4ea; color: #1e7e34; }
  .badge-bad { background: #fde8e8; color: #c62828; }
  .badge-warn { background: #fff3cd; color: #b26a00; }
  .badge-wait { background: #f5f5f5; color: #8a8a8a; }
  .trait-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(125px,1fr)); gap: 5px 10px; }
</style>
</head>
<body>
<div class="container py-4">
  <h3 class="mb-1">注册流程测量平台
    <button class="btn btn-sm btn-outline-secondary ms-2" onclick="showAdminModal()" id="admin-btn">待审核管理</button>
  </h3>
  <p class="text-muted small mb-3">
    共 <span id="stat-total">-</span> 站，人工已核验 <span id="stat-verified">-</span> 站；
    注册正确率 <span id="stat-accuracy">-</span>，覆盖率 <span id="stat-coverage">-</span>；
    登录正确率 <span id="stat-login-accuracy">-</span>，覆盖率 <span id="stat-login-coverage">-</span>
    <span class="ms-2">登录方法覆盖度 <span id="stat-login-mc">-</span> / 注册方法覆盖度 <span id="stat-signup-mc">-</span></span>
    <span id="stat-pending" class="ms-2"></span>
  </p>

  <div class="search-bar mb-4">
    <div class="input-group">
      <input id="search-input" class="form-control" placeholder="搜索站点域名或中文名（如 zhihu.com、慕课）">
      <button id="search-btn" class="btn btn-primary">搜索</button>
    </div>
  </div>

  <div class="card p-3 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <strong>输入网站主页，现场分类</strong>
    </div>
    <div class="input-group">
      <input id="classify-url" class="form-control" placeholder="https://example.com">
      <select id="classify-kind" class="form-select" style="max-width:170px">
        <option value="both">注册+登录</option>
        <option value="signup">注册</option>
        <option value="login">登录</option>
        <option value="policy">测试密码政策</option>
      </select>
      <button id="classify-btn" class="btn btn-success">开始分类</button>
    </div>
    <div class="form-check mt-2">
      <input id="force-retest" class="form-check-input" type="checkbox">
      <label class="form-check-label" for="force-retest">重复测试（忽略数据库，重新打开网站测量）</label>
      <div class="form-text">适合演示已收录的网站；新结果只保存在任务中，点击“加入数据库”后才会覆盖正式数据。</div>
    </div>
    <div id="classify-result" class="mt-3"></div>
  </div>

  <div class="card p-3 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <strong>我的测量任务</strong>
      <button class="btn btn-sm btn-outline-secondary" onclick="loadTasks()">刷新</button>
    </div>
    <div id="task-list" class="table-responsive">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead><tr>
          <th style="width:120px">任务 ID</th>
          <th>网站</th>
          <th style="width:90px">类型</th>
          <th style="width:100px">状态</th>
          <th style="width:130px">提交时间</th>
          <th style="width:230px"></th>
        </tr></thead>
        <tbody id="task-tbody">
          <tr><td colspan="6" class="text-muted text-center">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <strong>站点列表（<span id="list-count">-</span>）</strong>
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn btn-outline-secondary filter-btn active" data-f="all">全部</button>
      <button class="btn btn-outline-secondary filter-btn" data-f="verified">已核验</button>
      <button class="btn btn-outline-secondary filter-btn" data-f="pending">待核验</button>
      <button class="btn btn-outline-secondary filter-btn" data-f="match">识别基本正确</button>
      <button class="btn btn-outline-secondary filter-btn" data-f="mismatch">识别不一致</button>
      <button class="btn btn-outline-secondary filter-btn" data-f="incprog">程序证据不足</button>
      <button class="btn btn-outline-secondary filter-btn" data-f="incmanual">人工证据不足</button>
    </div>
  </div>
  <div id="site-list" class="row g-3"></div>
</div>

<div id="detailModal" class="my-modal" style="display:none">
  <div class="my-modal-box my-modal-lg">
    <div class="my-modal-head">
      <b id="modal-title"></b>
      <button type="button" class="my-modal-close" onclick="hideDetail()">×</button>
    </div>
    <div class="my-modal-body" id="modal-body"></div>
    <div class="my-modal-foot">
      <button type="button" class="btn btn-secondary btn-sm" onclick="hideDetail()">关闭</button>
    </div>
  </div>
</div>

<div id="reviewModal" class="my-modal" style="display:none">
  <div class="my-modal-box">
    <div class="my-modal-head">
      <b>提交人工观察</b>
      <button type="button" class="my-modal-close" onclick="hideReview()">×</button>
    </div>
    <div class="my-modal-body">
      <div class="mb-2"><b id="review-host"></b></div>
      <div id="review-pending-tip" class="mb-2"></div>
      <div class="mb-2">
        <label class="form-label">登录方式（勾选每种方法的要素，自动用 + 连接）</label>
        <div id="review-login-methods"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="addMethodRow('review-login')">+ 添加一种方法</button>
      </div>
      <div class="mb-2">
        <label class="form-label">注册方式（勾选每种方法的要素，自动用 + 连接）</label>
        <div id="review-signup-methods"></div>
        <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="addMethodRow('review-signup')">+ 添加一种方法</button>
      </div>
      <div class="mb-2 small">
        <b>总口令框判定（整站）：</b>
        <label class="me-2"><input type="radio" name="overall-pwd" value="inline" class="form-check-input me-1">inline（不提交就能判断口令对不对）</label>
        <label class="me-2"><input type="radio" name="overall-pwd" value="full" class="form-check-input me-1">full（提交后才能判断）</label>
        <label><input type="radio" name="overall-pwd" value="none" class="form-check-input me-1">none（无口令框）</label>
      </div>
      <div class="mb-2">
        <label class="form-label">备注（可选）</label>
        <input id="review-note" class="form-control" placeholder="如：注册按钮藏在登录弹窗里">
      </div>
      <div class="mb-2">
        <label class="form-label">你的名字</label>
        <input id="review-submitter" class="form-control" placeholder="姓名或昵称">
      </div>
      <div class="text-muted small">提交后进入待审核列表，管理员核验后合并进正式数据。</div>
    </div>
    <div class="my-modal-foot">
      <button type="button" class="btn btn-secondary btn-sm" onclick="hideReview()">取消</button>
      <button type="button" class="btn btn-primary btn-sm" id="review-submit-btn">提交</button>
    </div>
  </div>
</div>

<div id="feedbackModal" class="my-modal" style="display:none">
  <div class="my-modal-box">
    <div class="my-modal-head">
      <b>反馈识别结果</b>
      <button type="button" class="my-modal-close" onclick="hideFeedback()">×</button>
    </div>
    <div class="my-modal-body">
      <div class="mb-2"><b id="feedback-host"></b></div>
      <div class="mb-2">
        <label class="form-label">反馈类型</label>
        <select id="feedback-type" class="form-select">
          <option value="wrong">程序识别有误（和人工/实际不符）</option>
          <option value="correct_but_marked_wrong">程序其实是对的，但被标了不一致</option>
          <option value="other">其他问题</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label">说明（必填）</label>
        <textarea id="feedback-note" class="form-control" rows="3" placeholder="如：程序说注册是直接口令，实际注册只有手机号+验证码"></textarea>
      </div>
      <div class="mb-2">
        <label class="form-label">你的名字</label>
        <input id="feedback-submitter" class="form-control" placeholder="姓名或昵称">
      </div>
      <div class="text-muted small">反馈进入待审核列表，管理员确认后处理。</div>
    </div>
    <div class="my-modal-foot">
      <button type="button" class="btn btn-secondary btn-sm" onclick="hideFeedback()">取消</button>
      <button type="button" class="btn btn-primary btn-sm" id="feedback-submit-btn">提交反馈</button>
    </div>
  </div>
</div>

<div id="adminModal" class="my-modal" style="display:none">
  <div class="my-modal-box my-modal-lg">
    <div class="my-modal-head">
      <b>待审核管理（管理员）</b>
      <button type="button" class="my-modal-close" onclick="hideAdmin()">×</button>
    </div>
    <div class="my-modal-body">
      <div class="mb-2 d-flex gap-2">
        <input id="admin-token" class="form-control" type="password" placeholder="管理员口令" style="max-width:220px">
        <button type="button" class="btn btn-primary btn-sm" onclick="loadPending()">刷新列表</button>
      </div>
      <div id="admin-list" class="small"></div>
    </div>
    <div class="my-modal-foot">
      <button type="button" class="btn btn-secondary btn-sm" onclick="hideAdmin()">关闭</button>
    </div>
  </div>
</div>

<script>
const FLOW_ZH = {
  direct_password: "有口令框", identifier_then_password: "先账号后口令框",
  verification_then_password: "先验证后口令框", otp_only: "仅验证码",
  email_only: "仅邮箱", multiple_methods: "多方式并存",
  sso_only: "仅第三方", human_blocked: "需人工验证",
  no_web_signup: "无注册界面", unknown: "未确认", error: "异常"
};
let allSites = [];
let currentFilter = 'all';

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

function fmtTime(t) {
  if (!t) return '—';
  return String(t).slice(0, 10);
}
const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function methodsHtml(list) {
  if (!list || !list.length) return '<span class="text-muted">—</span>';
  return list.map((m, i) => {
    const num = CN_NUM[i] || (i + 1);
    return `<div class="small mb-1"><b>方法${num}：</b>${esc(m.name_zh || m.method)}</div>`;
  }).join('');
}
function reportTableHtml(login, signup, version) {
  const l = login || {};
  const s = signup || {};
  const only = !login && signup ? 'signup' : login && !signup ? 'login' : 'both';
  const tds = (fn) => only === 'login'
    ? `<td>${fn(l)}</td>`
    : only === 'signup'
      ? `<td>${fn(s)}</td>`
      : `<td>${fn(l)}</td><td>${fn(s)}</td>`;
  const badgeOf = (e) => badge((e && e.flow_type) || 'unknown');
  return `<table class="table table-sm table-bordered align-middle">
    <thead><tr><th style="width:80px">维度</th>${only === 'signup' ? '<th>注册（程序）</th>' : '<th>登录（程序）</th>'}${only === 'both' ? '<th>注册（程序）</th>' : ''}</tr></thead>
    <tbody>
      <tr><td>类型</td>${tds(badgeOf)}</tr>
      <tr><td>方法清单</td>${tds((e) => methodsHtml((e || {}).methods))}</tr>
      <tr><td>口令政策</td>${tds((e) => policyText((e || {}).policy))}</tr>
      <tr><td>测量时间</td>${tds((e) => fmtTime((e || {}).measured_at))}</tr>
      <tr><td>程序版本</td><td colspan="${only === 'both' ? 2 : 1}">${version || '?'}</td></tr>
    </tbody>
  </table>`;
}
function policyTestTableHtml(login, signup, version) {
  const l = login || {};
  const s = signup || {};
  // 是否实测到口令政策：入库时 pwd_policy 只在 inline/full 下非空
  const hasPwd = (e) => e && e.pwd_policy && typeof e.pwd_policy === 'object'
    && Object.keys(e.pwd_policy).length;
  const measuredLogin = hasPwd(l);
  const measuredSignup = hasPwd(s);
  const measured = measuredLogin || measuredSignup;
  const versionText = version || '?';
  if (measured) {
    // 实测到口令政策：只展示真实测得的数据，不加登录/注册分类
    const e = measuredSignup ? s : l;
    const method = (e && e.pwd_method) || '';
    const typeCell = method === 'inline' ? 'inline'
      : method === 'full' ? 'full' : '—';
    return `<table class="table table-sm table-bordered align-middle">
      <thead><tr><th colspan="2" class="text-center">密码政策测试</th></tr></thead>
      <tbody>
        <tr><td style="width:90px">类型</td><td>${typeCell}</td></tr>
        <tr><td>方法清单</td><td>进行密码政策测试</td></tr>
        <tr><td>口令政策</td><td>${measuredPolicyHtml(e.pwd_policy, method)}</td></tr>
        <tr><td>测量时间</td><td>${fmtTime(e.measured_at)}</td></tr>
        <tr><td>程序版本</td><td>${versionText}</td></tr>
      </tbody>
    </table>`;
  }
  // 未实测（无口令框/测试失败）→ 注册+分类，三列：条目 + 登录 + 注册
  const tds = (fn) => `<td>${fn(l)}</td><td>${fn(s)}</td>`;
  const badgeOf = (e) => badge((e && e.flow_type) || 'unknown');
  return `<table class="table table-sm table-bordered align-middle">
    <thead><tr><th colspan="3" class="text-center">注册与分类</th></tr></thead>
    <thead><tr><th style="width:90px">条目</th><th>登录（程序）</th><th>注册（程序）</th></tr></thead>
    <tbody>
      <tr><td>类型</td>${tds(badgeOf)}</tr>
      <tr><td>方法清单</td>${tds((e) => methodsHtml((e || {}).methods))}</tr>
      <tr><td>口令政策</td>${tds(() => '<span class="text-muted">—</span>')}</tr>
      <tr><td>测量时间</td>${tds((e) => fmtTime((e || {}).measured_at))}</tr>
      <tr><td>程序版本</td><td colspan="2">${versionText}</td></tr>
    </tbody>
  </table>`;
}
function badge(flow) {
  return `<span class="flow-badge b-${flow || 'unknown'}">${FLOW_ZH[flow] || '未确认'}</span>`;
}
function matchBadge(status) {
  return status === "manual_verified"
    ? '<span class="match-badge badge verified">已人工核验</span>'
    : '<span class="match-badge badge pending">待人工复核</span>';
}
const PWD_TEST_ZH = { inline: 'inline', full: 'full', none: 'none' };
function pwdBadge(value) {
  if (!value) return '';
  const cls = value === 'inline' ? 'badge-ok'
    : value === 'full' ? 'badge-warn' : 'badge-wait';
  return `<span class="side-badge ${cls}">口令${PWD_TEST_ZH[value] || value}</span>`;
}
function siteCard(s) {
  const kw = (s.keywords || []).filter(k => k !== s.hostname).slice(0, 2).join(' / ');
  const sideBadge = (label, status) => {
    const config = status === 'match' ? ['识别正确', 'badge-ok']
      : status === 'mismatch' ? ['识别错误', 'badge-bad']
      : status === 'pending' ? ['待核验', 'badge-wait']
      : ['证据不足', 'badge-wait'];
    return `<span class="side-badge ${config[1]}">${label}${config[0]}</span>`;
  };
  const pwd = (s.manual && s.manual.pwd_testability) || {};
  return `
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 p-3">
      <div class="d-flex justify-content-between align-items-start">
        <a href="#" class="text-decoration-none fw-bold site-link site-title" data-host="${esc(s.hostname)}">${esc(s.hostname)}</a>
        ${matchBadge(s.match_status)}
      </div>
      <div class="small text-muted">${esc(kw)}</div>
      <div class="mt-2 small">
        <div>登录 ${badge(s.login.flow_type)} ${sideBadge('登录', s.login_match)}</div>
        <div class="mt-1">注册 ${badge(s.signup.flow_type)} ${sideBadge('注册', s.signup_match)}</div>
      </div>
      <div class="mt-2">
        <button class="btn btn-sm btn-outline-secondary detail-btn" data-host="${esc(s.hostname)}">详情</button>
        <button class="btn btn-sm btn-outline-primary review-btn" data-host="${esc(s.hostname)}">提交人工观察</button>
      </div>
    </div>
  </div>`;
}
function renderSites() {
  let list = allSites;
  if (currentFilter === 'verified') list = allSites.filter(s => s.match_status === 'manual_verified');
  if (currentFilter === 'pending') list = allSites.filter(s => s.match_status !== 'manual_verified');
  // 登录/注册两侧合并判定：任一侧错误即不一致；有正确侧且无错误侧即基本正确。
  if (currentFilter === 'match') list = allSites.filter(s =>
    (s.login_match === 'match' || s.signup_match === 'match') &&
    s.login_match !== 'mismatch' && s.signup_match !== 'mismatch');
  if (currentFilter === 'mismatch') list = allSites.filter(s =>
    s.login_match === 'mismatch' || s.signup_match === 'mismatch');
  if (currentFilter === 'incprog') list = allSites.filter(s =>
    s.login_match === 'inconclusive_program' || s.signup_match === 'inconclusive_program');
  if (currentFilter === 'incmanual') list = allSites.filter(s =>
    s.login_match === 'inconclusive_manual' || s.signup_match === 'inconclusive_manual');
  document.getElementById('list-count').textContent = list.length;
  const el = document.getElementById('site-list');
  el.innerHTML = list.length
    ? list.map(siteCard).join('')
    : '<div class="text-muted">无匹配站点</div>';
}
async function loadStats() {
  const r = await fetch('/api/stats');
  const d = await r.json();
  document.getElementById('stat-total').textContent = d.total_sites;
  document.getElementById('stat-verified').textContent = d.manual_verified;
  if (d.program_accuracy) {
    document.getElementById('stat-accuracy').textContent =
      d.program_accuracy.rate + '%（' + d.program_accuracy.match + '/' + d.program_accuracy.total + '）';
    document.getElementById('stat-coverage').textContent =
      d.program_accuracy.coverage_rate + '%（可判定 ' + d.program_accuracy.evaluated + '/' + d.program_accuracy.verified + '）';
  }

function methodElements(prefix) {
  // 登录侧勾"无登录界面"，注册侧勾"无注册界面"（同一 no_web 语义）
  const noUiLabel = prefix.indexOf('login') >= 0 ? '无登录界面' : '无注册界面';
  return [
    ['phone', '手机号'], ['email', '邮箱'], ['account', '账号'],
    ['password', '口令'], ['code', '验证码'], ['captcha', '人机验证'],
    ['scan', '扫码'], ['sso', '第三方'], ['tos', '协议'], ['no_web', noUiLabel]
  ];
}
function methodRowHtml(prefix, index) {
  const boxes = methodElements(prefix).map(([val, label]) =>
    `<label class="me-2"><input type="checkbox" class="form-check-input me-1 method-el" data-el="${val}" onchange="updateMethodPreview('${prefix}')">${label}</label>`).join('');
  return `<div class="border rounded p-2 mb-1 method-row" data-prefix="${prefix}">
    <b>方法${['一','二','三','四','五','六','七','八','九','十'][index] || (index + 1)}：</b>${boxes}
    <span class="method-preview text-success"></span>
  </div>`;
}
function addMethodRow(prefix) {
  const box = document.getElementById(prefix + '-methods');
  const rows = box.querySelectorAll('.method-row');
  box.insertAdjacentHTML('beforeend', methodRowHtml(prefix, rows.length));
}
function updateMethodPreview(prefix) {
  const box = document.getElementById(prefix + '-methods');
  const elements = methodElements(prefix);
  box.querySelectorAll('.method-row').forEach(row => {
    const labels = [...row.querySelectorAll('.method-el:checked')]
      .map(el => elements.find(([v]) => v === el.dataset.el)[1]);
    row.querySelector('.method-preview').textContent =
      labels.length ? '＝ ' + labels.join('+') : '';
  });
}
function initMethodRows(prefix) {
  const box = document.getElementById(prefix + '-methods');
  box.innerHTML = methodRowHtml(prefix, 0);
}
function readMethodRows(prefix) {
  const box = document.getElementById(prefix + '-methods');
  const lines = [];
  const traits = {};
  box.querySelectorAll('.method-row').forEach(row => {
    const labels = [...row.querySelectorAll('.method-el:checked')]
      .map(el => methodElements(prefix).find(([v]) => v === el.dataset.el)[1]);
    if (labels.length) lines.push(labels.join('+'));
    [...row.querySelectorAll('.method-el:checked')].forEach(el => {
      const v = el.dataset.el;
      if (v === 'password') traits.password = true;
      if (v === 'code') traits.otp = true;
      if (v === 'captcha') traits.captcha = true;
      if (v === 'scan') traits.scan = true;
      if (v === 'sso') traits.sso = true;
      if (v === 'tos') traits.tos = true;
      if (v === 'no_web') traits.no_web = true;
    });
  });
  return { text: lines.join('\n'), traits: traits };
}

function policyText(policy) {
  if (!policy || !Object.keys(policy).length) return '未测量';
  const auth = policy.authentication || {};
  const parts = [];
  if (auth.password_observed) parts.push('有密码框');
  else if (auth.password_status && PWD_STATUS_ZH[auth.password_status])
    parts.push('密码框：' + PWD_STATUS_ZH[auth.password_status]);
  if (auth.verification_observed) parts.push('存在验证环节');
  if (auth.blocking_factors && auth.blocking_factors.length)
    parts.push('被' + auth.blocking_factors.map(b => BLOCKER_ZH[b] || b).join('、') + '拦住');
  const meas = policy.measurement || {};
  if (meas.status) parts.push('测量情况：' + (STATUS_ZH[meas.status] || meas.status));
  return parts.join('；') || '未测量';

  if (!surface.length && !protocolClaims.length && !meterClaims.length && !joseClaims.length && !webauthnClaims.length && !oidcClaims.length && !recoveryClaims.length && !qrLifecycleClaims.length && !leakyClaims.length) return '';
  return `<div class="alert alert-light py-2 mt-2">
    <div><b>访客可见认证安全（论文证据层）</b></div>
    <div class="small text-muted mb-1">只报告公开观察结果；入口存在不代表实现安全，未观察到也不判定为不支持。</div>
    <div class="small"><b>认证因子：</b>${factors.length ? factors.map(esc).join('、') : '当前未确认'}</div>
    ${capability('auth.passkey.public_offer', 'Passkey/WebAuthn')}
    ${capability('auth.federation.public_offer', 'OAuth/OIDC/第三方登录')}
    ${capability('auth.qr.public_offer', '二维码登录')}
    <div><b>MFA强制：</b><span class="text-secondary">未知（多种登录方式不等于多因素组合）</span></div>
    <div><b>风险认证RBA：</b><span class="text-secondary">未知（需授权账号对照实验）</span></div>
    <div class="mt-1"><b>OAuth/OIDC公开请求证据：</b>${oauthHtml}</div>
    ${meterHtml}
    ${joseHtml}
    ${webauthnHtml}
    ${oidcHtml}
    ${recoveryHtml}
    ${qrLifecycleHtml}
    ${leakyHtml}
  </div>`;
}
function isPolicyMeasured(d) {
  return !!(d && (d.policy_measured === true ||
    (d.policy && typeof d.policy === 'object' && 'restrictive' in d.policy)));
}
function classificationOnlyTableHtml(d) {
  return `<table class="table table-sm table-bordered align-middle mt-2 mb-0">
    <thead><tr><th style="width:80px">条目</th><th>注册（程序）</th></tr></thead>
    <tbody>
      <tr><td>类型</td><td>${badge(d.flow_type)}</td></tr>
      <tr><td>方法清单</td><td>${methodsHtml(d.methods)}</td></tr>
      <tr><td>口令政策</td><td>—</td></tr>
      <tr><td>测量时间</td><td>${fmtTime(d.measured_at)}</td></tr>
      <tr><td>程序版本</td><td>v4</td></tr>
    </tbody>
  </table>`;
}
function policyBoxHtml(d) {
  const method = d.method_used;
  const measured = isPolicyMeasured(d);
  if (!measured) {
    // 提示政策（inline 无法建立反馈时解析的页面自述规则）
    const hint = (d.policy || {})._hint_policy;
    const hintHtml = hint && hint.raw_texts && hint.raw_texts.length
      ? `<div class="alert alert-warning py-2 mt-2 mb-0">
          <div><b>页面提示政策（非实测）</b></div>
          ${hint.length_min || hint.length_max
            ? `<div class="small mt-1">长度：${hint.length_min || '?'}${hint.length_max ? ' ~ ' + hint.length_max : ' 以上'}</div>`
            : ''}
          ${(hint.charset_hints || []).length
            ? `<div class="small mt-1">字符要求：${hint.charset_hints.join('、')}</div>`
            : ''}
          <div class="small text-muted mt-1">${hint.raw_texts.map(esc).join('<br>')}</div>
        </div>`
      : '';
    return `
      <div class="alert alert-info py-2 mb-2">
        <div><b>注册与分类</b> ${badge(d.flow_type)}</div>
        <div class="mt-2">${classificationOnlyTableHtml(d)}</div>
        <div class="mt-2">${extraLines(d, '注册')}</div>
        <div class="small text-muted mt-1">密码政策测试未完成，仅输出注册与分类结果</div>
        ${hintHtml}
        ${d.error ? `<div class="small text-danger mt-1">${esc(d.error)}</div>` : ''}
      </div>`;
  }
  // 类型：实际用哪种方法测的就填哪种（inline / full）；无口令框则不填
  const typeCell = method === 'inline' ? 'inline（不提交即可判断）'
    : method === 'full' ? 'full（需提交）'
    : '—';
  const methodCell = '进行密码政策测试';
  const policyCell = measuredPolicyHtml(d.policy, method);
  return `
    <div class="alert alert-info py-2 mb-2">
      <div><b>测试密码政策</b> ${badge(d.flow_type)}</div>
      <table class="table table-sm table-bordered align-middle mt-2 mb-0">
        <thead><tr><th style="width:90px">密码政策测试</th><th>结果</th></tr></thead>
        <tbody>
          <tr><td>类型</td><td>${typeCell}</td></tr>
          <tr><td>方法清单</td><td>${methodCell}</td></tr>
          <tr><td>口令政策</td><td>${policyCell}</td></tr>
          <tr><td>测量时间</td><td>${fmtTime(d.measured_at)}</td></tr>
          <tr><td>程序版本</td><td>v4</td></tr>
        </tbody>
      </table>
      ${d.note ? `<div class="small text-muted mt-1">${esc(d.note)}</div>` : ''}
      ${d.error ? `<div class="small text-danger mt-1">${esc(d.error)}</div>` : ''}
      ${d.suspicious_login_form ? '<div class="alert alert-warning py-1 mt-1 mb-0">疑似在登录表单上测量，政策数据可能不可信</div>' : ''}
    </div>`;
}
// ── 我的测量任务（异步队列）──
const TASK_STATUS_ZH = {
  queued: '排队中', running: '测量中', done: '完成', error: '失败', cancelled: '已取消'
};
let taskPollTimer = null;

function taskKindLabel(kind) {
  return kind === 'policy' ? '口令政策' : (kind === 'classify' ? '分类' : kind);
}
function taskResultSummary(t) {
  const r = t.result || {};
  const p = r.policy || {};
  const len = p.length && p.length[0] !== 0 ? `长度 [${p.length}]` : '';
  const flow = r.flow_type || '';
  return [flow, len, r.flow_zh || ''].filter(Boolean).join(' · ');
}
async function loadTasks() {
  try {
    const r = await fetch('/api/tasks?limit=20');
    const d = await r.json();
    const tbody = document.getElementById('task-tbody');
    const tasks = d.tasks || [];
    if (!tasks.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center">还没有测量任务，在上方提交一个吧</td></tr>';
      clearTaskPoll();
      return;
    }
    tbody.innerHTML = tasks.map(t => {
      const running = t.status === 'queued' || t.status === 'running';
      const badge = t.status === 'done' ? 'success'
        : t.status === 'error' ? 'danger'
        : t.status === 'cancelled' ? 'secondary' : 'primary';
      const summary = t.status === 'done'
        ? `<span class="text-muted small">${esc(taskResultSummary(t))}</span>`
        : (t.error ? `<span class="text-danger small">${esc(String(t.error).slice(0, 40))}</span>` : '');
      return `<tr>
        <td class="small"><code>${esc(t.task_id)}</code></td>
        <td>${esc(t.url)}</td>
        <td class="small">${taskKindLabel(t.kind)}${t.force_retest ? '<div class="badge bg-warning text-dark mt-1">重复测试</div>' : ''}</td>
        <td><span class="badge bg-${badge}">${running ? '<span class="spinner-border spinner-border-sm me-1"></span>' : ''}${TASK_STATUS_ZH[t.status] || t.status}</span></td>
        <td class="small text-muted">${fmtTime(t.created_at)}</td>
        <td class="text-end">
          ${t.status === 'done' ? `
            <button class="btn btn-sm btn-outline-primary" onclick="showTaskResult('${t.task_id}')">查看</button>
            <button class="btn btn-sm btn-outline-success" onclick="addTaskToDb('${t.task_id}')">加入数据库</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteTask('${t.task_id}')">删除</button>
          ` : ''}
          ${t.status === 'queued' ? `<button class="btn btn-sm btn-outline-secondary" onclick="cancelTask('${t.task_id}')">取消</button>` : ''}
        </td>
      </tr>`;
    }).join('');
    // 有进行中任务时自动轮询（每 5 秒）
    const hasRunning = tasks.some(t => t.status === 'queued' || t.status === 'running');
    if (hasRunning) {
      if (!taskPollTimer) {
        taskPollTimer = setInterval(() => { loadTasks(); }, 5000);
      }
    } else {
      clearTaskPoll();
    }
  } catch (err) {
    document.getElementById('task-tbody').innerHTML =
      `<tr><td colspan="6" class="text-danger text-center">任务列表加载失败: ${esc(String(err))}</td></tr>`;
  }
}
function clearTaskPoll() {
  if (taskPollTimer) { clearInterval(taskPollTimer); taskPollTimer = null; }
}
async function cancelTask(taskId) {
  await fetch(`/api/tasks/${taskId}/cancel`, { method: 'POST' });
  loadTasks();
}
async function deleteTask(taskId) {
  if (!confirm('确定删除该任务记录？')) return;
  const r = await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
  if (!r.ok) { const d = await r.json(); alert(d.detail || '删除失败'); return; }
  loadTasks();
}
async function addTaskToDb(taskId) {
  const r = await fetch(`/api/tasks/${taskId}`);
  const t = await r.json();
  if (t.status !== 'done' || !t.result) { alert('任务未完成，无法入库'); return; }
  const d = t.result;
  let login = {}, signup = {}, url = '';
  const mkEntry = (x) => {
    const isPwdMeasured = isPolicyMeasured(x);
    return {
      flow_type: x.flow_type, flow_zh: x.flow_zh,
      route: x.route || '', final_url: x.final_url || '',
      steps: x.states || [], raw_states: x.states || [],
      policy: isPwdMeasured ? (x.classification_policy || {}) : (x.policy || {}),
      pwd_policy: isPwdMeasured ? (x.policy || {}) : {},
      pwd_method: x.method_used,
      confidence: x.confidence, stop_reason: x.stop_reason,
      primary_method: x.primary_method, evidence: x.evidence || [],
      error: x.error || null, measured_at: x.measured_at
    };
  };
  if (d.entry_kind === 'both') {
    // 合并结果：注册/登录分别入库（已测侧为库中旧数据，覆盖更新为最新）
    url = d.url || t.url || '';
    if (d.signup && d.signup.flow_type) signup = mkEntry(d.signup);
    if (d.login && d.login.flow_type) login = mkEntry(d.login);
  } else if (d.entry_kind === 'login') {
    url = d.url || t.url || '';
    login = mkEntry(d);
  } else {
    url = d.url || t.url || '';
    signup = mkEntry(d);
  }
  if (!login.flow_type && !signup.flow_type) { alert('没有可入库的结果'); return; }
  const host = url.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  const token = prompt('请输入管理员口令：', '');
  if (token === null) return;
  const res = await fetch('/api/sites', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      hostname: host, url: url, version: 'v4',
      login: login, signup: signup, admin_token: token
    })
  });
  const resp = await res.json();
  if (!res.ok) { alert(resp.detail || '写入失败'); return; }
  alert(resp.message || '已写入数据库');
  loadStats();
  search('');
}
async function showTaskResult(taskId) {
  const r = await fetch(`/api/tasks/${taskId}`);
  const t = await r.json();
  const result = t.result || {};
  let body;
  if (t.kind === 'policy') {
    const p = result.policy || {};
    const len = p.length && p.length[0] !== 0 ? p.length : null;
    body = `<div class="alert alert-info py-2">
        <div><b>${esc(t.url)}</b> — ${t.status === 'done' ? '口令政策测量完成' : '未完成'}</div>
        <div class="small text-muted">${fmtTime(t.created_at)} 提交 · ${fmtTime(t.finished_at)} 完成</div>
        ${t.force_retest ? '<div class="badge bg-warning text-dark mt-1">已忽略数据库并重新测量</div>' : ''}
        ${result.from_database ? '<div class="badge bg-secondary mt-1">数据库已有结果，未重复测量</div>' : ''}
      </div>
      ${t.status === 'done' ? policyBoxHtml(result) : ''}
      ${securityAssessmentHtml(result.application_security)}
      ${t.error ? `<div class="alert alert-danger py-2">${esc(t.error)}</div>` : ''}`;
  } else if (result.entry_kind === 'both') {
    // 注册+登录合并结果：已测侧标注"数据库已有"，未测侧为现场结果
    const signup = result.signup || {};
    const login = result.login || {};
    const signupTag = result.signup_from_database ? '（数据库已有）' : '（现场测量）';
    const loginTag = result.login_from_database ? '（数据库已有）' : '（现场测量）';
    body = `<div class="alert alert-info py-2">
        <div><b>${esc(t.url)}</b> — 注册+登录分类</div>
        <div class="small text-muted">${fmtTime(t.created_at)} 提交${t.finished_at ? ' · ' + fmtTime(t.finished_at) + ' 完成' : ''}</div>
        ${t.force_retest ? '<div class="badge bg-warning text-dark mt-1">已忽略数据库并重新测量</div>' : ''}
      </div>
      ${signup.flow_type ? `
        <div class="alert alert-info py-2 mb-2"><div><b>注册${signupTag}</b></div>
          <div class="mt-2">${reportTableHtml(null, signup, 'v4')}</div>
          <div class="mt-2">${extraLines(signup, '注册')}</div>
          ${securityAssessmentHtml(signup.application_security)}
        </div>` : (signup.error ? `<div class="alert alert-danger py-2">注册失败: ${esc(signup.error)}</div>` : '')}
      ${login.flow_type ? `
        <div class="alert alert-info py-2 mb-2"><div><b>登录${loginTag}</b></div>
          <div class="mt-2">${reportTableHtml(login, null, 'v4')}</div>
          <div class="mt-2">${extraLines(login, '登录')}</div>
          ${securityAssessmentHtml(login.application_security)}
        </div>` : (login.error ? `<div class="alert alert-danger py-2">登录失败: ${esc(login.error)}</div>` : '')}
      ${securityAssessmentHtml(result.application_security)}
      ${t.error ? `<div class="alert alert-danger py-2">${esc(t.error)}</div>` : ''}`;
  } else {
    body = `<div class="alert alert-info py-2">
        <div><b>${esc(t.url)}</b> — ${TASK_STATUS_ZH[t.status] || t.status}</div>
        <div class="small text-muted">${fmtTime(t.created_at)} 提交${t.finished_at ? ' · ' + fmtTime(t.finished_at) + ' 完成' : ''}</div>
        ${t.force_retest ? '<div class="badge bg-warning text-dark mt-1">已忽略数据库并重新测量</div>' : ''}
      </div>
      ${t.status === 'done' ? reportTableHtml(
        result.entry_kind === 'login' ? result : null,
        result.entry_kind === 'signup' ? result : null, 'v4') : ''}
      ${result.flow_type ? extraLines(result, '分类') : ''}
      ${securityAssessmentHtml(result.application_security)}
      ${t.error ? `<div class="alert alert-danger py-2">${esc(t.error)}</div>` : ''}`;
  }
  document.getElementById('modal-title').textContent = '任务结果';
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('detailModal').style.display = 'flex';
}
loadTasks();
document.getElementById('classify-btn').addEventListener('click', async () => {
  const url = document.getElementById('classify-url').value.trim();
  const kind = document.getElementById('classify-kind').value;
  const forceRetest = document.getElementById('force-retest').checked;
  if (!url) { alert('请输入网站 URL'); return; }
  const btn = document.getElementById('classify-btn');
  const box = document.getElementById('classify-result');
  btn.disabled = true;
  try {
    // 异步任务模式：提交立即返回 task_id，后台测量，刷新页面不影响。
    if (kind === 'policy') {
      const r = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, kind: 'policy', entry_kind: 'signup', method: 'auto', force_retest: forceRetest })
      });
      const d = await r.json();
      if (d.detail) { box.innerHTML = `<div class="alert alert-danger py-2">${esc(d.detail)}</div>`; return; }
      box.innerHTML = `<div class="alert alert-success py-2">
        <div><b>口令政策测量任务已提交</b></div>
        <div class="small mt-1">任务 ID: <code>${esc(d.task_id)}</code></div>
        <div class="small text-muted">${forceRetest ? '已忽略数据库并重新打开网站测量。' : '若数据库已有口令政策，将直接使用已有结果。'}后台任务约需 1-15 分钟，刷新页面不影响测量。</div>
      </div>`;
    } else {
      const entryKind = kind;  // 'both' 原样提交，后端分别查库/现场测
      const r = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, kind: 'classify', entry_kind: entryKind, force_retest: forceRetest })
      });
      const d = await r.json();
      if (d.detail) { box.innerHTML = `<div class="alert alert-danger py-2">${esc(d.detail)}</div>`; return; }
      const label = kind === 'both' ? '注册+登录' : (kind === 'signup' ? '注册' : '登录');
      box.innerHTML = `<div class="alert alert-success py-2">
        <div><b>${label}任务已提交</b></div>
        <div class="small mt-1">任务 ID: <code>${esc(d.task_id)}</code></div>
        <div class="small text-muted">${forceRetest ? '已忽略数据库，将重新打开网站测量。' : '已测过的部分直接使用数据库结果，未测的部分后台测量。'}完成后在下方"我的测量任务"查看。</div>
      </div>`;
    }
    loadTasks();
  } catch (err) {
    box.innerHTML = `<div class="alert alert-danger py-2">请求失败: ${err}</div>`;
  } finally {
    btn.disabled = false;
  }
});

loadStats();
search('');
// 其他浏览器或组员提交的数据无需手动刷新；打开弹窗时暂停，避免打断填写。
setInterval(() => {
  const modalOpen = [...document.querySelectorAll('.my-modal')]
    .some(el => el.style.display && el.style.display !== 'none');
  if (!modalOpen && document.visibilityState === 'visible') {
    loadStats();
    search(document.getElementById('search-input').value);
  }
}, 30000);
</script>
</body>
</html>
